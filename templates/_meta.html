{# 공통 소셜 공유(OG/Twitter) + 파비콘 메타태그.
   호출하는 템플릿에서 meta_title, meta_description, meta_image, meta_path, favicon를 정의하고 include. #}
<meta name="description" content="{{ meta_description }}">
<meta name="theme-color" content="#ff5f8f">

<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="사주 간지 계산기">
<meta property="og:title" content="{{ meta_title }}">
<meta property="og:description" content="{{ meta_description }}">
<meta property="og:image" content="{{ meta_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{ public_base_url }}{{ meta_path }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ meta_title }}">
<meta name="twitter:description" content="{{ meta_description }}">
<meta name="twitter:image" content="{{ meta_image }}">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ meta_title }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E{{ favicon }}%3C/text%3E%3C/svg%3E">
